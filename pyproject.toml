    { name = "d41116036", email = "63022463+d41116036@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "black>=26.5.1",
    "isort>=9.0.2",
    "langchain>=1.4.3",
    "langchain-google-genai>=4.4.0",
    "langchain-pinecone>=0.2.13",
    "langchain-tavily>=0.2.18",
